<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormHTML</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="contact-us">
        <!-- action="form.php" - для обращения к скрипту на сервере для обработки формы. enctype="multipart/form-data" - метод кодирования (в данном случае для отправки файлов)-->
        <form name="userForm" method="POST" action="form.php" enctype="multipart/form-data">
            <label for="">Ваше имя:<input type="text" name="userName"></label>
            <label for="">Ваш email:<input type="email" name="userEmail"></label>
            <label for="">Ваш комментарий:<textarea name="userMessage"></textarea></label>
            <label for="">Ваше фото: <input type="file" name="userFoto"></label>
            <input type="submit" name="send" value="Отправить">
        </form>
    </div>
</body>
</html>
